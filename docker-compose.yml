services:
  frontend:
    build: .
    image: ghcr.io/divyanshijain234-eng/devops-24eskcs116:mt2
    ports:
      - "8080:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped