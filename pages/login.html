<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
    <!-- navbar -->
    <div class="mt-0 flex px-4 sm:px-12 lg:px-24 justify-between h-12 items-center">
        <p>Devflow</p>
        <p>
            <a href="../landing.html">Back to home</a>
        </p>
    </div>
    <div class="flex flex-col md:flex-row items-stretch gap-0 mx-4 sm:mx-12 lg:mx-auto my-4 sm:my-6 w-auto max-w-6xl rounded-3xl overflow-hidden">
    <!-- left paanel : img -->
    <section class="w-full md:w-5/12 md:self-stretch flex items-center justify-center overflow-hidden">
        <img
            src="../assets/images/forms.png"
            alt="Authentication illustration"
            class="w-full h-full object-cover"
        >
    </section>

     <!-- right panel : form -->
    <section class="bg-white w-full md:w-7/12 md:self-stretch py-10 md:py-16 px-6 md:px-10 border-2 border-gray-400 rounded-none md:rounded-r-3xl">
        <h1 class="left font-extrabold text-4xl">Welcome back</h1>
        <p class="text-gray-500 text-sm mb-6">Login to continue your workspace.</p>

        <form action="#" method="post"
            class="flex flex-col gap-4 ">

            <div>
                <label for="email">Email</label> <br>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                    <input 
                        class="w-full flex items-center justify-center border-gray-400 border-2 rounded-sm p-0.5 pl-10 "
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>
            </div>
            <div>
                <label for="password">Password</label> <br>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input 
                        class="w-full flex items-center justify-center border-gray-400 border-2 rounded-sm p-0.5 pl-10 "
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter a strong password"
                        required
                    >
                </div>
            </div>

            <div class="flex justify-between">
                <label>
                    <input type="checkbox" name="remember">
                        Remember me
                    </input> 
                </label>

                <a 
                    class="text-blue-500 text-bold "
                    href="#">Forgot password?</a>
            </div>

            <div class="flex justify-center">
                <button class=" bg-blue-500 w-3/5 rounded-sm h-10 hover:bg-blue-400" type="submit" >Login</button>
            </div>
        </form>

        <div class="flex flex-col">
        <div class="flex items-center gap-3 my-4">
            <span class="flex-1 border-t border-gray-300"></span>
            <p class="text-gray-400">or continue with</p>
            <span class="flex-1 border-t border-gray-300"></span>
        </div>        
        <div class="flex flex-col gap-4">
            <button class="text-gray-400 border-2 rounded-sm p-2 flex items-center justify-center gap-2 " type="button"><img src="../assets/images/icons/google.svg" alt="" width="20" height="20" class="inline-block align-middle">Continue with Google</button>
            <button class="text-gray-400 border-2 rounded-sm p-2 flex items-center justify-center gap-2 " type="button"><img src="../assets/images/icons/apple.svg" alt="" width="20" height="20" class="inline-block align-middle">Continue with Apple</button>
        </div>

    </div>

       
        <p class="text-gray-400 flex gap-4 mt-6">
            Don't have an account?
            <a class="text-blue-500 text-bold" href="signup.htmp">Sign up</a>
        </p>
     </section>
    </div>

</body>
</html>
