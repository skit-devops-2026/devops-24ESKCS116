<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Devflow</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">
    <!-- navbar -->
    <div class="mt-0 flex px-4 sm:px-12 lg:px-24 justify-between h-14 items-center">
        <a href="../index.html" class="font-extrabold text-xl text-blue-950">Devflow</a>
        <p>
            <a href="../index.html" class="text-sm font-medium text-gray-600 hover:text-blue-600 transition">Back to home</a>
        </p>
    </div>
    
    <div class="flex flex-col md:flex-row items-stretch gap-0 mx-4 sm:mx-12 lg:mx-auto my-4 sm:my-6 w-auto max-w-6xl rounded-3xl overflow-hidden shadow-lg">
        <!-- left panel : img -->
        <section class="w-full md:w-5/12 md:self-stretch flex items-center justify-center overflow-hidden bg-blue-50">
            <img
                src="../assets/images/forms.png"
                alt="Authentication illustration"
                class="w-full h-full object-cover"
            >
        </section>

        <!-- right panel : form -->
        <section class="bg-white w-full md:w-7/12 md:self-stretch py-10 md:py-16 px-6 md:px-10 border border-gray-200 rounded-none md:rounded-r-3xl">
            <h1 class="left font-extrabold text-4xl text-gray-900">Welcome back</h1>
            <p class="text-gray-500 text-sm mb-6 mt-1">Login to continue your workspace.</p>

            <form id="loginForm" action="#" method="post" class="flex flex-col gap-4">
                <div>
                    <label for="email" class="text-sm font-semibold text-gray-700">Email</label> <br>
                    <div class="relative mt-1">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                        <input 
                            class="w-full border-gray-300 border rounded-lg p-2.5 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>
                </div>
                <div>
                    <label for="password" class="text-sm font-semibold text-gray-700">Password</label> <br>
                    <div class="relative mt-1">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input 
                            class="w-full border-gray-300 border rounded-lg p-2.5 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>
                </div>

                <div class="flex justify-between items-center text-sm mt-1">
                    <label class="flex items-center gap-2 text-gray-600">
                        <input type="checkbox" name="remember" class="rounded border-gray-300 text-blue-600">
                        Remember me
                    </label>

                    <a class="text-blue-600 font-semibold hover:underline" href="#">Forgot password?</a>
                </div>

                <div class="flex justify-center mt-2">
                    <button class="bg-blue-600 w-full rounded-lg h-11 text-white font-semibold hover:bg-blue-500 transition shadow-sm" type="submit">Login</button>
                </div>
            </form>

            <div class="flex flex-col">
                <div class="flex items-center gap-3 my-5">
                    <span class="flex-1 border-t border-gray-200"></span>
                    <p class="text-gray-400 text-xs uppercase tracking-wider">or continue with</p>
                    <span class="flex-1 border-t border-gray-200"></span>
                </div>        
                <div class="flex flex-col gap-3">
                    <button class="text-gray-700 border border-gray-300 hover:bg-gray-50 rounded-lg p-2.5 text-sm font-medium flex items-center justify-center gap-2 transition" type="button"><img src="../assets/images/icons/google.svg" alt="" width="18" height="18" class="inline-block align-middle">Continue with Google</button>
                    <button class="text-gray-700 border border-gray-300 hover:bg-gray-50 rounded-lg p-2.5 text-sm font-medium flex items-center justify-center gap-2 transition" type="button"><img src="../assets/images/icons/apple.svg" alt="" width="18" height="18" class="inline-block align-middle">Continue with Apple</button>
                </div>
            </div>

            <p class="text-gray-500 text-sm flex gap-2 mt-6 justify-center">
                Don't have an account?
                <a class="text-blue-600 font-semibold hover:underline" href="signup.html">Sign up</a>
            </p>
        </section>
    </div>

    <div class="h-6"></div>

    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
