<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Devflow</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <!-- navbar -->
    <div class="mt-0 flex px-4 sm:px-12 lg:px-24 justify-between h-12 items-center">
        <p>Devflow</p>

        <p>
            <a href="../landing.html">Back to home</a>
        </p>
    </div>


    <!-- signup container -->
    <div
        class="flex flex-col md:flex-row items-stretch gap-0 mx-4 sm:mx-12 lg:mx-auto my-4 sm:my-6 w-auto max-w-6xl rounded-3xl overflow-hidden"
    >

        <!-- left panel : image -->
        <section
            class="w-full md:w-5/12 md:self-stretch flex items-center justify-center overflow-hidden"
        >
            <img
                src="../assets/images/forms.png"
                alt="Authentication illustration"
                class="w-full h-full object-cover"
            >
        </section>


        <!-- right panel : signup form -->
        <section
            class="bg-white w-full md:w-7/12 md:self-stretch py-10 md:py-12 px-6 md:px-10 border-2 border-gray-400 rounded-none md:rounded-r-3xl"
        >

            <h1 class="font-extrabold text-4xl">
                Create your account
            </h1>

            <p class="text-gray-500 text-sm mb-6">
                Join Devflow and start building your best work.
            </p>


            <form action="#" method="post" class="flex flex-col gap-4">

                <!-- Full Name -->
                <div>
                    <label for="name">Full Name</label>

                    <div class="relative">
                        <svg
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M20 21a8 8 0 0 0-16 0"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>

                        <input
                            class="w-full border-gray-400 border-2 rounded-sm p-2 pl-10"
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your full name"
                            autocomplete="name"
                            required
                        >
                    </div>
                </div>


                <!-- Email -->
                <div>
                    <label for="email">Email</label>

                    <div class="relative">
                        <svg
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>

                        <input
                            class="w-full border-gray-400 border-2 rounded-sm p-2 pl-10"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>


                <!-- Password -->
                <div>
                    <label for="password">Password</label>

                    <div class="relative">
                        <svg
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect width="18" height="11" x="3" y="11" rx="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>

                        <input
                            class="w-full border-gray-400 border-2 rounded-sm p-2 pl-10"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                </div>


                <!-- Confirm Password -->
                <div>
                    <label for="confirm-password">Confirm Password</label>

                    <div class="relative">
                        <svg
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect width="18" height="11" x="3" y="11" rx="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>

                        <input
                            class="w-full border-gray-400 border-2 rounded-sm p-2 pl-10"
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                </div>


                <!-- Terms -->
                <div>
                    <label class="flex items-start gap-2 text-sm text-gray-600">
                        <input
                            type="checkbox"
                            name="terms"
                            required
                            class="mt-1"
                        >

                        <span>
                            I agree to the
                            <a href="#" class="text-blue-500">
                                Terms of Service
                            </a>
                            and
                            <a href="#" class="text-blue-500">
                                Privacy Policy
                            </a>
                        </span>
                    </label>
                </div>


                <!-- Create Account -->
                <div class="flex justify-center">
                    <button
                        class="bg-blue-500 w-3/5 rounded-sm h-10 text-white hover:bg-blue-400"
                        type="submit"
                    >
                        Create Account
                    </button>
                </div>

            </form>


            <!-- social login separator -->
            <div class="flex flex-col">

                <div class="flex items-center gap-3 my-4">

                    <span class="flex-1 border-t border-gray-300"></span>

                    <p class="text-gray-400 whitespace-nowrap">
                        or sign up with
                    </p>

                    <span class="flex-1 border-t border-gray-300"></span>

                </div>


                <!-- Social buttons -->
                <div class="flex flex-col gap-4">

                    <button
                        class="text-gray-400 border-2 rounded-sm p-2 flex items-center justify-center gap-2"
                        type="button"
                    >
                        <img
                            src="../assets/images/icons/google.svg"
                            alt="Google"
                            width="20"
                            height="20"
                        >

                        Continue with Google
                    </button>


                    <button
                        class="text-gray-400 border-2 rounded-sm p-2 flex items-center justify-center gap-2"
                        type="button"
                    >
                        <img
                            src="../assets/images/icons/apple.svg"
                            alt="Apple"
                            width="20"
                            height="20"
                        >

                        Continue with Apple
                    </button>

                </div>

            </div>


            <!-- login link -->
            <p class="text-gray-400 flex gap-4 mt-6">

                Already have an account?

                <a
                    class="text-blue-500"
                    href="login.html"
                >
                    Log in
                </a>

            </p>

        </section>

    </div>
    <script src="../scripts/signup.js"></script>

</body>

</html>
